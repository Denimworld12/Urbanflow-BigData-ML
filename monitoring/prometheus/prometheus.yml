# Prometheus scrape config for UrbanFlow's big-data stacks.
#
# Each big-data stack runs on its own Docker network with a fixed name
# (urbanflow-hadoop, urbanflow-hbase-net, urbanflow-streaming). `make
# monitor-up` connects Prometheus and json-exporter to whichever of those
# networks exist (scripts/monitor_attach.sh), so targets below are plain
# service names on the daemons' own ports. A stack that is not running (or
# was started after monitoring and not attached yet) shows as a down target
# (up == 0) in the Overview dashboard; nothing here fails.
# After editing this file: make monitor-reload (no restart needed).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  # --- the monitoring stack itself ------------------------------------------
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels: {stack: monitoring, component: prometheus}

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
        labels: {stack: monitoring, component: grafana}

  - job_name: cadvisor
    scrape_interval: 10s
    # cAdvisor stamps samples with its own collection time; with those kept,
    # a stopped container's series would linger for 5 minutes. Scrape time
    # lets Prometheus mark it stale on the next scrape instead.
    honor_timestamps: false
    static_configs:
      - targets: ["cadvisor:8080"]
        labels: {stack: monitoring, component: cadvisor}
    metric_relabel_configs:
      # Short, readable label names for the two compose labels cAdvisor keeps.
      - source_labels: [container_label_com_docker_compose_project]
        target_label: compose_project
      - source_labels: [container_label_com_docker_compose_service]
        target_label: compose_service
      - regex: container_label_com_docker_compose_(project|service)
        action: labeldrop
      # stack/component above describe cAdvisor itself (for `up`); on the
      # container series they would wrongly say every container is "monitoring".
      - regex: stack|component
        action: labeldrop

  # --- Hadoop core: HDFS + YARN + MapReduce + Hive (docker-compose.hadoop.yml)
  # Hadoop daemons serve metrics only as JSON at /jmx.
  - job_name: hadoop
    metrics_path: /probe
    static_configs:
      - targets: ["http://namenode:9870/jmx"]
        labels: {stack: hadoop, component: namenode, module: namenode}
      - targets: ["http://datanode:9864/jmx"]
        labels: {stack: hadoop, component: datanode, module: datanode}
      - targets: ["http://resourcemanager:8088/jmx"]
        labels: {stack: hadoop, component: resourcemanager, module: resourcemanager}
      - targets: ["http://nodemanager:8042/jmx"]
        labels: {stack: hadoop, component: nodemanager, module: nodemanager}
      - targets: ["http://historyserver:19888/jmx"]
        labels: {stack: hadoop, component: historyserver, module: jvm}
    # /jmx is JSON, not Prometheus text, so these scrapes go through
    # json-exporter: the target URL becomes ?target=..., the module comes from
    # the `module` label, and the request itself is sent to json-exporter.
    relabel_configs: &json_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [module]
        target_label: __param_module
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: json-exporter:7979

  # The two Hive JVMs run the Prometheus JMX agent on :9404, so Prometheus
  # scrapes them directly.
  - job_name: hive
    static_configs:
      - targets: ["hiveserver2:9404"]
        labels: {stack: hadoop, component: hiveserver2}
      - targets: ["hive-metastore:9404"]
        labels: {stack: hadoop, component: hive-metastore}

  # --- HBase + ZooKeeper (docker-compose.hbase.yml) -------------------------
  - job_name: hbase
    metrics_path: /probe
    static_configs:
      - targets: ["http://hbase-master:16010/jmx"]
        labels: {stack: hbase, component: hbase-master, module: hbase_master}
      - targets: ["http://hbase-regionserver:16030/jmx"]
        labels: {stack: hbase, component: hbase-regionserver, module: hbase_regionserver}
      - targets: ["http://hbase-thrift:9095/jmx"]
        labels: {stack: hbase, component: hbase-thrift, module: jvm}
      # ZooKeeper's AdminServer (on by default, container port 8080).
      - targets: ["http://zookeeper:8080/commands/mntr"]
        labels: {stack: hbase, component: zookeeper, module: zookeeper}
    relabel_configs: *json_relabel

  # --- Kafka + Spark Structured Streaming (docker-compose.streaming.yml) ----
  # kafka-exporter ships with the streaming stack and already speaks
  # Prometheus: topic offsets (throughput) and consumer-group lag.
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]
        labels: {stack: streaming, component: kafka-exporter}

  # The Spark Structured Streaming job (`make stream-run`) runs on the host,
  # not in a container, with its UI and Prometheus servlet on :4050. It is
  # only up while the job is running.
  - job_name: spark-streaming
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ["host.docker.internal:4050"]
        labels: {stack: streaming, component: spark-driver}
