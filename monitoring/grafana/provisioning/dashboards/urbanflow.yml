# Loads every dashboard JSON in /etc/grafana/dashboards (mounted from
# monitoring/grafana/dashboards) into the "UrbanFlow" folder. The JSON files
# are generated by scripts/build_dashboards.py; edit that, not the JSON.
apiVersion: 1
providers:
  - name: urbanflow
    folder: UrbanFlow
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /etc/grafana/dashboards
