# UrbanFlow real-time path — opt-in, runs alongside the batch stack.
#
#   make stream-up        # Kafka (KRaft, no ZooKeeper) + kafka-exporter, topics created
#   make stream-produce   # replay bronze trips into the `trips` topic
#   make stream-run       # Spark Structured Streaming: 5-min windows per zone
#   make stream-down      # stop it (data kept) — `make stream-reset` wipes it
#
# Only the infrastructure runs in containers; the producer and the Spark job
# run from the project venv like every other stage. The batch stack
# (docker-compose.yml, `make` targets, dashboard on :8501) is untouched by
# this file. Full explanation: docs/hadoop/streaming.md
name: urbanflow-streaming

services:
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"   # host clients: producer, Spark job, CLI tools
    environment:
      # KRaft: this one process is both the broker and the controller that
      # used to be ZooKeeper's job. The metadata log lives in Kafka itself.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Two client listeners: INTERNAL for containers on this network
      # (kafka:29092), EXTERNAL for processes on the host (localhost:9092).
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Single broker, so every internal topic can only have one replica.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by `make stream-up`, with a known
      # partition count — a typo in a topic name should fail, not create one.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 24

  # Exposes Kafka state as Prometheus metrics at :9308/metrics — topic
  # offsets (so rate() gives messages/sec), partition counts, broker count
  # and consumer-group lag. The monitoring stack scrapes this.
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    command: ["--kafka.server=kafka:29092", "--kafka.version=3.9.0"]
    ports:
      - "${KAFKA_EXPORTER_PORT:-9308}:9308"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kafka-data:

networks:
  default:
    # Fixed name so the monitoring stack can join it and scrape
    # kafka-exporter:9308 by container name.
    name: urbanflow-streaming
