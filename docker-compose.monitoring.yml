# Opt-in monitoring stack: Prometheus + Grafana + exporters.
#   make monitor-up      (= docker compose -p urbanflow-monitoring -f docker-compose.monitoring.yml up -d)
#   make monitor-down
# Grafana http://localhost:3000 (admin / urbanflow), Prometheus http://localhost:9090.
# Both listen on 127.0.0.1 only; MONITOR_BIND=0.0.0.0 exposes them on the LAN
# (set GRAFANA_PASSWORD first).
#
# `make monitor-up` also runs scripts/monitor_attach.sh, which connects
# Prometheus and json-exporter to the Hadoop, HBase and streaming stacks'
# networks (whichever exist), so they scrape those daemons by service name.
# The networks are not declared `external` here on purpose: that would stop
# this stack from starting unless every other stack were already up. A stack
# that is down simply shows as a down target (up == 0).
name: urbanflow-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
    ports:
      - "${MONITOR_BIND:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"   # the Spark job runs on the host; Linux needs this line
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:12.1.1
    depends_on: [prometheus]
    ports:
      - "${MONITOR_BIND:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-urbanflow}
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # read-only viewing without login, for the demo
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/overview.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

  # Per-container CPU / memory / network for every container on this Docker
  # host. The containerd socket mount is what lets it resolve container names
  # and compose labels on Docker Desktop's containerd image store.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=10s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
      - --enable_metrics=cpu,memory,network
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped

  # Hadoop, HBase and ZooKeeper report their metrics as JSON (/jmx and
  # /commands/mntr), not in Prometheus text format. json-exporter fetches that
  # JSON on each scrape and converts the fields we care about into Prometheus
  # metrics, so those stacks need no config change and no agent jar.
  json-exporter:
    image: quay.io/prometheuscommunity/json-exporter:v0.7.0
    command: ["--config.file=/config/config.yml"]
    volumes:
      - ./monitoring/json-exporter:/config:ro
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
